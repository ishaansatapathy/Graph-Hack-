services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: stackfox-falkordb
    ports:
      - "6379:6379"
      - "3001:3000"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  # VS Code fork (Gitpod OpenVSCode Server) — embedded in the web app at /app/ide
  vscode:
    image: gitpod/openvscode-server:latest
    container_name: stackfox-vscode
    command: ["--host", "0.0.0.0", "--without-connection-token"]
    ports:
      - "3002:3000"
    volumes:
      - .:/home/workspace:cached
    restart: unless-stopped

volumes:
  falkordb_data:
